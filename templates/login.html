{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบจัดการหลังบ้าน | The Book & Brew</title>
    
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Custom Style System -->
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            padding: 24px;
        }
        .login-card {
            background: #FFFFFF;
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .login-header {
            background: linear-gradient(135deg, var(--palette-pink), #B7008F);
            color: #FFFFFF;
            padding: 32px 28px;
            text-align: center;
        }
        .login-body {
            padding: 36px 32px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <div class="brand-icon mx-auto mb-3" style="width: 54px; height: 54px; font-size: 26px; background: rgba(255, 255, 255, 0.2); box-shadow: none;">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h4 class="fw-bold mb-1">The Book & Brew</h4>
            <div class="text-white-50 small">ระบบจัดการหลังบ้าน (Staff & Admin Portal)</div>
        </div>

        <div class="login-body">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show rounded-3 small py-2" role="alert">
                        <i class="bi bi-info-circle me-1"></i> {{ message }}
                        <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" action="{% url 'admin_login' %}">
                {% csrf_token %}
                <div class="form-group mb-3">
                    <label for="username" class="form-label small fw-bold">ชื่อผู้ใช้งาน (Username)</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control form-control-custom border-start-0" id="username" name="username" placeholder="เช่น admin" required autofocus>
                    </div>
                </div>

                <div class="form-group mb-4">
                    <label for="password" class="form-label small fw-bold">รหัสผ่าน (Password)</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-key"></i></span>
                        <input type="password" class="form-control form-control-custom border-start-0" id="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn-confirm-booking w-100 mb-3">
                    <i class="bi bi-box-arrow-in-right me-1"></i> เข้าสู่ระบบ
                </button>

                <div class="text-center">
                    <a href="{% url 'home' %}" class="text-muted text-decoration-none small">
                        <i class="bi bi-arrow-left me-1"></i> กลับสู่หน้าหลักร้านกาแฟ
                    </a>
                </div>
            </form>

            <div class="mt-4 pt-3 border-top text-center text-muted" style="font-size: 0.78rem;">
                <i class="bi bi-info-circle me-1"></i> บัญชีแอดมินเริ่มต้น: <code>admin</code> / <code>admin1234</code>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
